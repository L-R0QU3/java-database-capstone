# ===============================
# Application
# ===============================
spring.application.name=SmartCare Clinic Management System
server.port=8080

# ===============================
# MySQL (JPA / Hibernate)
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/cms?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# MongoDB
# ===============================
spring.data.mongodb.uri=mongodb://localhost:27017/prescriptions

# ===============================
# JWT (custom properties)
# ===============================
jwt.secret=SmartCareSecretKeyForJWTGenerationMustBeLongEnough1234567890
jwt.expiration=86400000

# ===============================
# Logging
# ===============================
logging.level.org.springframework.security=INFO
logging.level.com.smartcare=DEBUG
